# Alembic configuration. DB URL is read from app Settings in env.py (not here).
[alembic]
script_location = src/app/alembic
prepend_sys_path = src
version_path_separator = os
# Migration filenames: {YYMMDD}_{HHMM}_{slug}
file_template = %%(year)02d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
