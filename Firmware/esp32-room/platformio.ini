; BreezeLink - ROOM-CORNER SENSOR node (room).
; Board: ESP32-C3-DevKitM-1 (ESP32-C3-MINI-1, 4MB flash, single-core RISC-V).
;
; Four identical boards sit in the four corners of a room, differing only in
; DEVICE_UUID (and ROOM_CORNER, a pure label) in src/config.h. No WiFi, no MQTT --
; they broadcast ESP-NOW to the gateway mounted near the air conditioner.
;
; ONE ENV PER BOARD, declared in `nodes.ini` (gitignored; template in
; nodes.ini.example):
;
;     pio run -e ss1 -t upload --upload-port COM30
;     pio device monitor -e ss1 --port COM30
;
; The section below is NOT an env -- it is the shared part that the four envs
; `extends`. There being no `[env:...]` in this file is deliberate: a bare
; `pio run` builds all four boards, which is exactly what you want when checking
; whether a change broke any of them.
;
; DO NOT RUN `pio pkg install` TO ADD A LIBRARY -- it rewrites this file and
; strips every comment. Add to lib_deps by hand and let `pio run` fetch it. (A
; lesson already paid for once.)
; ---------------------------------------------------------------------------
;  CHOOSING PINS ON THE ESP32-C3 -- the pins you MUST AVOID:
;
;    GPIO2, GPIO8, GPIO9   strapping pins. GPIO9 is the BOOT button: pulled low at
;                          reset it enters the bootloader. Hanging a DHT22 (with
;                          its 4.7k pull-up to 3.3V) on GPIO9 does the opposite --
;                          it holds it HIGH, and the board loses the ability to
;                          enter programming mode via the button.
;    GPIO18, GPIO19        USB D-/D+. Using them as GPIO costs you the USB port,
;                          and the DevKitM-1 has no other route for flashing.
;    GPIO11..17            wired to the SPI flash inside the module. Touch them
;                          and the board dies instantly.
;    GPIO20, GPIO21        UART0 (serial log). Usable, but you lose the log.
;
;  GPIO4 is clean: no strapping role, no hardware claiming it, and it reaches a
;  header.
;
;  THE DHT22 USES A BIDIRECTIONAL ONE-WIRE PROTOCOL -- a 4.7k pull-up to 3.3V on
;  the data line is mandatory. Without it, reads succeed intermittently (the
;  checksum catches the bad ones, so you get NO wrong numbers, just interleaved
;  NaN) -- a symptom that looks a lot like a loose wire.
;
;  POWER THE DHT22 FROM 3.3V, NOT 5V: the ESP32-C3 pins do not tolerate
;  overvoltage, and a 5V-powered DHT22 drives the data line up towards 5V.
; ---------------------------------------------------------------------------
[platformio]
; The four envs (ss1..ss4) live in their own file because they contain a real
; customer's DEVICE_UUIDs. Without that file `pio run` errors out immediately --
; deliberately: better to stop than to build a firmware with no identity and flash
; it onto a board.
extra_configs = nodes.ini

[room_base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    ; DHT22. THE "for ESPx" VERSION AND NOT `adafruit/DHT sensor library` -- the
    ; Adafruit one disables interrupts for over A SECOND when no sensor is
    ; connected (its loop of 80 expectPulse() rounds never exits early). On a
    ; dual-core ESP32 that already panicked core 1; on a SINGLE-CORE C3 it is
    ; worse -- the WiFi/ESP-NOW stack runs on that very core -- giving scattered
    ; missing readings and then a board that resets before the log can print
    ; anything.
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19.0
    ; WiFi MUST be declared explicitly even though no line in src/ includes it:
    ; PlatformIO's dependency scanner only looks at includes inside src/ and
    ; inside library directories, and `<WiFi.h>` now lives in
    ; ../shared/espnow-slave-radio.h -- which is neither. Without this line the
    ; build fails at "WiFi.h: No such file or directory", and because the error
    ; line points into the shared file it is very easy to go looking in the header
    ; instead.
    WiFi
build_flags =
    ; espnow-message.h + espnow-slave-radio.h are shared with the outdoor node and
    ; the gateway. ESP-NOW ships inside ESP-IDF, so NO external library is needed.
    -I../shared
    -D DHT_PIN=4               ; see the pin-selection comment block above
    ; ROUTE `Serial` TO THE USB PORT. Without these two flags Serial goes out over
    ; UART0 (GPIO20/21) -- and on a board using the native USB-Serial/JTAG
    ; (esptool prints `USB mode: USB-Serial/JTAG`, VID 303A) UART0 is not connected
    ; to any USB port at all, so the log goes somewhere nobody can read. The
    ; symptom is very easy to misdiagnose: the flash reports success, the hash
    ; verifies, and opening the serial monitor is as silent as a dead board.
    ;
    ; PlatformIO's `esp32-c3-devkitm-1` board does not enable them (its
    ; extra_flags only has -DARDUINO_ESP32C3_DEV) because the genuine DevKitM-1
    ; has a CP2102N attached to UART0; the board used here does not.
    ;
    ; Harmless in the field: with no USB connected, Serial.print() goes nowhere
    ; rather than blocking the loop.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
