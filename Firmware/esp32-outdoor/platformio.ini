; ============================================================================
;  BreezeLink - OUTDOOR node  -  ESP32-C3-DevKitM-1
; ----------------------------------------------------------------------------
;   pio run -e esp32-espnow -t upload --upload-port COMx
;   pio device monitor -p COMx -b 115200
;
;  Role: ESP-NOW SLAVE. Reads a DHT22 and broadcasts to the indoor gateway; the
;  gateway publishes to MQTT on its behalf. This node does NOT join WiFi and does
;  NOT connect to MQTT, so it holds no MQTT token either.
; ----------------------------------------------------------------------------
;  MOVED FROM ESP32 DevKit V1 TO ESP32-C3 (2026-08-15) -- A BOARD CHANGE ONLY,
;  THE FUNCTIONALITY IS UNCHANGED. Same chip family as the 4 room-corner nodes, so
;  from now on all five sensor nodes share one board, one toolchain, one set of
;  lessons learned. Three things HAD to change with it, and missing any of them
;  fails silently -- see each block below:
;      1. transmit power   (failure: frames go nowhere, node still reports "sent")
;      2. DHT library      (failure: panics the core when no sensor is connected)
;      3. the two USB flags (failure: serial as silent as a dead board even though
;                            the flash reported success)
; ============================================================================

[env:esp32-espnow]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    ; DHT22. THE "for ESPx" VERSION AND NOT `adafruit/DHT sensor library` -- the
    ; same reason recorded in ../esp32-room/platformio.ini: the Adafruit one
    ; disables interrupts for over a second when no sensor is connected
    ; (expectPulse() never exits early). On a dual-core ESP32 that was already
    ; enough to cause a panic; on a SINGLE-CORE C3 it is worse -- the WiFi/ESP-NOW
    ; stack runs on that very core.
    ;
    ; THIS IS A MANDATORY CHANGE THAT COMES WITH THE BOARD, not optional tidying:
    ; the old board (dual-core ESP32) tolerated the Adafruit version, this one does
    ; not.
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19.0
    ; WiFi MUST be declared explicitly even though no line in src/ includes it:
    ; PlatformIO's dependency scanner only looks at includes inside src/ and inside
    ; library directories, and `<WiFi.h>` lives in ../shared/espnow-slave-radio.h --
    ; which is neither. Without this line the build fails at "WiFi.h: No such file
    ; or directory", and because the error line points into the shared file it is
    ; very easy to go looking in the header instead.
    WiFi

build_flags =
    ; espnow-message.h + espnow-slave-radio.h are shared with the gateway and the
    ; 4 corner nodes
    -I../shared

    ; --- ROUTE `Serial` TO THE USB PORT ---
    ; Without these two flags Serial goes out over UART0 (GPIO20/21) -- and on a
    ; board using the native USB-Serial/JTAG (esptool prints `USB mode:
    ; USB-Serial/JTAG`, VID 303A) UART0 is not connected to any USB port at all, so
    ; the log goes somewhere nobody can read. The symptom is very easy to
    ; misdiagnose: the flash reports success, the hash verifies, and opening the
    ; serial monitor is as silent as a dead board.
    ;
    ; PlatformIO's `esp32-c3-devkitm-1` board does not enable them because the
    ; genuine DevKitM-1 has a CP2102N attached to UART0; the board used here does
    ; not.
    ;
    ; Harmless in the field: with no USB connected, Serial.print() goes nowhere
    ; rather than blocking the loop.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ============================================================================
;  TRANSMIT POWER -- `-D SLAVE_TX_POWER=78` HAS BEEN REMOVED, AND THIS IS THE
;  BIGGEST CONSEQUENCE OF THE BOARD CHANGE
; ----------------------------------------------------------------------------
;  The old board (ESP32 DevKit V1) could run at 19.5 dBm for a very specific
;  reason: it has an AMS1117 with proper decoupling, so it could supply the ~350mA
;  current peak while transmitting. The outdoor node is also the FURTHEST node --
;  through at least one wall -- so forcing it down to 8 dBm back then would have
;  meant crippling its range because of a different board's problem.
;
;  THIS BOARD IS THE OPPOSITE CASE. A USB-powered ESP32-C3-DevKitM-1 is precisely
;  the board that the 8 dBm default in ../shared/espnow-slave-radio.h exists to
;  protect: at maximum power the voltage sags at the current peak, the transmitted
;  signal is distorted, and the gateway receives 0 packets -- exactly as if a wire
;  were broken.
;
;  Keeping the 78 flag after the board change would be the worst possible failure
;  mode: broadcast has NO ACK, so the node keeps printing "sent" on schedule while
;  nobody can hear a thing. Not one log line anywhere reports an error.
;
;  TO RAISE IT AGAIN you must give the node a decent supply (its own adapter +
;  decoupling), then raise it gradually and VERIFY WITH THE GATEWAY LOG -- check
;  whether the `Ngoai troi` line shows `MAT KET NOI`, and whether the `[relay]`
;  counter is increasing steadily. Do not trust the node's own report.
; ============================================================================
