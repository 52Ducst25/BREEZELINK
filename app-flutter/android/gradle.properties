org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Tat bien dich tang dan cua Kotlin.
#
# VI SAO: tren may Windows nay, build release dut lien tuc o dung mot cho voi
#   Could not close incremental caches in build\<plugin>\kotlin\
#     compileReleaseKotlin\cacheable\caches-jvm\jvm\kotlin:
#     class-fq-name-to-source.tab, source-to-classes.tab, ...
# Dinh ba module plugin (package_info_plus, shared_preferences_android,
# url_launcher_android). Da loai tru cac nghi can thong thuong: xoa sach thu muc
# caches-jvm thi loi TAI LAP y nguyen (nen khong phai cache cu hong), dia con
# 41GB, duong dan 148 ky tu (xa gioi han 260). Stack trace chi vao
# LazyStorage.createMap -> loi ngay luc TAO map, va Kotlin da tu roi ve
# compileNonIncrementally roi van chet o buoc dong cache.
#
# Nghi con lai la Defender/AV giu khoa cac tep .tab, hoac loi cua chinh co che
# incremental. Ca hai deu khong sua duoc tu trong du an, con co che nay thi build
# CI/release khong can den — no chi de tang toc build lap lai khi dev.
#
# Danh doi: build sach cham hon mot chut. Doi lai build chay duoc.
kotlin.incremental=false
