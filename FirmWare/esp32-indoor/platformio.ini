; Aircon — node TRONG NHÀ (indoor), kiêm luôn MASTER.
; Bo: QR Box Advance Touch Screen (ESP32-WROOM-32E-N8 + màn 2.8" YT280S030/ST7789).
;
; Node này gộp 3 vai trò vào một bo (xem ../README.md §6):
;   1. Đọc nhiệt/ẩm -> telemetry (t_in/h_in cho thuật toán comfort)
;   2. Phát/học hồng ngoại -> điều khiển máy lạnh
;   3. Nhận ESP-NOW từ node outdoor rồi chuyển tiếp lên MQTT
;
; VÌ SAO node này nối WiFi/MQTT TRỰC TIẾP chứ không làm ESP-NOW slave:
;   lệnh từ backend mang theo `ir_raw` — mảng vài trăm mốc thời gian µs, cỡ
;   vài KB (command_publisher.py). ESP-NOW giới hạn 250 byte/gói, muốn đi qua
;   master thì phải tự viết giao thức chia mảnh + ghép lại + báo thiếu mảnh.
;   Nối MQTT thẳng thì broker đã lo sẵn việc đó.
;
;   pio run -e qrbox-touch -t upload --upload-port COMx   ; USB-TTL cắm vào P3
;
; ĐỪNG CHẠY `pio pkg install` ĐỂ THÊM THƯ VIỆN — nó viết lại file này và XOÁ
; SẠCH mọi chú thích (đã mất một lần, phải khôi phục từ git). Thêm tay vào
; lib_deps rồi để `pio run` tự tải.
;
; MỘT BO, MỘT ENV — trước đây file này còn hai env nữa (esp32-devkit cho ESP32
; DevKit V1 trần, esp32-s3 cho ESP32-S3 DevKitC) từ giai đoạn thử nghiệm. Cả hai
; đã bỏ: dự án chốt chạy trên bo QR Box Advance, giữ thêm env cho bo không có
; trong tay chỉ tạo ra cấu hình không ai build và không ai kiểm chứng được.
; Cần quay lại bo trần thì xem lịch sử git (commit trước bản này).
; ---------------------------------------------------------------------------
;  SƠ ĐỒ CHÂN IR + CẢM BIẾN (bản hiện hành — xem ../Interface/README.md §3):
;
;    IR phát  -> GPIO5  = UART_2_TX (pad chân RX của module A7680C), 3.3V thẳng
;    IR thu   -> GPIO17 = UART_2_RX (pad chân TX của module A7680C), 3.3V thẳng
;    DHT22    -> GPIO2  = UART_1_RX, ra cổng P3 QUA TXS0104 (mức 5V)
;
;  Không dùng 26/27 như bo DevKit vì bo này đã lấy hết: GPIO26 là opto ra (không
;  phát nổi sóng mang 38kHz), GPIO27 là đèn nền, GPIO4 là I2C SCL.
;  GPIO15 (UART_1_TX, ra P3 qua TXS0104) hiện ĐỂ TRỐNG.
;
;  BỐN RÀNG BUỘC PHẢI NHỚ, mỗi cái đều hỏng theo kiểu KHÔNG BÁO LỖI:
;
;  1. CHỈ CÒN DHT22 ĐI QUA TXS0104 -> EN_LEVEL_SHIFT (GPIO12) phải HIGH thì mới
;     đọc được nhiệt/ẩm. Bỏ hai dòng pinMode/digitalWrite trong ui.cpp là nhiệt/ẩm
;     ra NaN vĩnh viễn. IR (cả phát GPIO5 lẫn thu GPIO17) nằm trên cặp UART_2 nối
;     3.3V thẳng nên KHÔNG dính.
;
;  2. VÌ SAO IR PHÁT PHẢI RỜI KHỎI TXS0104 (đã thử GPIO15 trên bo thật):
;     LED của module phát SÁNG LIÊN TỤC. TXS0104 chỉ GIỮ mức bằng trở ~40k ở
;     trạng thái ổn định (mạch one-shot chỉ kích mạnh vài chục ns lúc chuyển mức)
;     nên nó KHÔNG kéo nổi ngõ vào module xuống thấp, cũng không cấp nổi dòng cho
;     LED hồng ngoại hay cực B của NPN. Hỏng kép: IR câm, mà LED lại chạy DC liên
;     tục -> nóng và suy giảm nhanh.
;     Đây là giới hạn của IC chứ không của chân, nên GPIO2 (nửa còn lại của cùng
;     cặp UART_1) cũng vậy — đừng thử lại đường đó.
;     GPIO5 lái đẩy-kéo thật nên hết cả hai. Trả giá: mức 3.3V thay vì 5V nên tầm
;     phát ngắn hơn, và chân không ra header — phải hàn vào pad module.
;     Ở 3.3V thì module phát nên có transistor riêng; loại chỉ có LED nối tiếp
;     trở (kiểu KY-005) vẫn chạy nhưng dòng thấp, tầm phát yếu.
;
;     GPIO5 LÀ CHÂN STRAPPING NHƯNG VÔ HẠI Ở ĐÂY: nó cùng MTDO chọn TIMING CỦA
;     SDIO SLAVE — chế độ mà thiết kế này không bao giờ dùng. Mức lúc reset không
;     ảnh hưởng gì tới việc boot. (Khác hẳn GPIO12/MTDI chọn mức flash, sai là
;     bo chết ngay.) Dù sao R6 100k cũng kéo GPIO5 lên sẵn, còn IRsend để chân ở
;     mức THẤP lúc rảnh — nhưng đó là sau khi strapping đã lấy mẫu xong.
;
;  3. DHT22 QUA TXS0104: ĐẶT TRỞ KÉO 4.7k Ở PHÍA P3, KHÔNG PHẢI PHÍA CHIP.
;     GPIO2 là chân strapping chọn chế độ nạp: lúc reset nó phải THẤP hoặc thả
;     nổi thì mới vào được serial bootloader. Hàn trở kéo thẳng vào chân GPIO2 là
;     giữ nó ở mức CAO -> MẤT KHẢ NĂNG NẠP FIRMWARE QUA USB-TTL, mà bo này không
;     có đường nạp nào khác. (Chân GPIO15 để trống cạnh đó hỏng theo chiều ngược
;     lại: nó là MTDO, kéo THẤP lúc reset là tắt sạch log boot trên U0TXD.)
;     Đặt phía P3 thì an toàn: lúc reset R7 10k giữ GPIO12 ở THẤP nên TXS0104
;     đang Hi-Z, cách ly hẳn mọi trở ngoài khỏi chân chip.
;
;     ĐÃ KIỂM CHỨNG CHẠY TRÊN ĐÚNG CHÂN NÀY: "t=30.1C h=49%", đọc liên tiếp 30.1
;     rồi 29.9 — nhích tự nhiên, không nhảy loạn. Không hiển nhiên, vì DHT22 là
;     giao thức MỘT DÂY HAI CHIỀU (MCU kéo thấp ~1ms mở đầu rồi NHẢ cho cảm biến
;     lái tiếp) mà TXS0104 tự đoán chiều bằng mạch one-shot — đảo chiều giữa
;     chừng đúng là chỗ loại IC này hay lỗi.
;     Vẫn cần trở kéo 4.7k: R5/R6 100k trên pad A7680C quá yếu cho sườn ~1µs.
;     Dấu hiệu nếu hỏng: đọc được lúc được lúc không, NaN xen kẽ (checksum bắt
;     được nên KHÔNG ra số sai).
;
;  4. GPIO17 thu IR: pad chân TX của A7680C, 3.3V thẳng, KHÔNG qua TXS0104 nên
;     không phụ thuộc EN_LEVEL_SHIFT. Có sẵn R5 100k kéo lên. Không ra header —
;     phải hàn dây vào pad. NUÔI MẮT THU BẰNG 3.3V, KHÔNG 5V: không chân ESP32
;     nào chịu quá áp (ngưỡng tuyệt đối VDD+0.3 ~ 3.6V).
;     GPIO17 không mang vai trò strapping nào — sạch nhất trong các chân còn lại.
;
;     CẢ HAI CHÂN IR ĐỀU MƯỢN PAD CỦA MODULE A7680C -> ĐIỀU KIỆN BẮT BUỘC: KHÔNG
;     HÀN MODULE 4G LÊN BO. Hàn vào là hai chân có hai chủ, IR câm hoàn toàn.
;
;     VÌ SAO KHÔNG DÙNG GPIO36/39 (SENSOR_VP/VN) NỮA — đã thử và đo trên bo:
;     hai chân đó là cực C của opto TLP291 (U7/U9) trong khối PULSE OUT CONFIG,
;     có sẵn trở kéo 10k lên 3.3V (R22/R27) nên nhìn thì rất hợp. Nhưng đo thực
;     tế ở đó: mắt thu ra 2.08V lúc rảnh và 4.85V khi có tín hiệu.
;       - 4.85V vượt ngưỡng tuyệt đối của chân -> diode ESD dẫn ngược vào rail
;         3.3V mỗi lần có tín hiệu, lâu dài là hỏng chân.
;       - 2.08V nằm LỌT GIỮA hai ngưỡng logic (thấp < ~0.83V, cao > ~2.48V) nên
;         chip không đọc được là 0 hay 1 — chập chờn và dẫn xuyên tầng đệm.
;       - Chiều tín hiệu còn NGƯỢC với chuẩn: mắt thu TSOP/VS1838B phải rảnh ở
;         mức CAO và kéo XUỐNG khi bắt burst, mà IRremoteESP8266 giả định đúng
;         chuẩn đó. Ngược chiều thì học ra mã rác.
;     Nếu sau này quay lại hai chân đó: nối vào phía MCU (SIGNAL_IN_MCU_x) chứ
;     đừng nối vào SIGNAL_IN_x (đầu LED của opto qua trở 750R — tín hiệu bị đảo
;     và bị TLP291 làm méo sườn hàng chục µs, hỏng phép đo mark/space). Và nhớ
;     errata ESP32: GPIO36/39 bị xung nhiễu ~80ns xuống thấp mỗi khi khối SAR ADC
;     bật/tắt nguồn, mà IRrecv bắt bằng NGẮT SƯỜN nên xung đó lọt thẳng vào khung
;     thu -> đừng gọi analogRead() trên bất kỳ chân ADC1 nào.
;
;     ĐỪNG đặt DHT_PIN vào dải GPIO34..39: chân chỉ vào không kéo dây xuống được
;     nên DHT22 không bao giờ trả lời, mà pinMode(36, OUTPUT) lại KHÔNG báo lỗi —
;     hỏng câm, chỉ ra NaN mãi. Firmware có chốt chặn in cảnh báo ở boot
;     (DHT_PIN_OK trong main.cpp) để chặn kiểu chẩn đoán sai đó.
;
;  SHT3x trên I2C 0x44 VẪN CÒN trong firmware và được ưu tiên nếu dò thấy — nó có
;  CRC nên đáng tin hơn DHT22. Không đấu thì tự động rơi về DHT22.
;
;  Cờ TFT_* phải nằm ở đây chứ không trong config.h: TFT_eSPI đọc chúng lúc
;  biên dịch THƯ VIỆN. Cũng không sửa User_Setup.h của thư viện — file đó nằm
;  trong .pio/, `pio pkg update` là mất sạch.
; ---------------------------------------------------------------------------
[env:qrbox-touch]
platform = espressif32
board = esp32doit-devkit-v1        ; cùng ESP32-WROOM-32 (bản N8, 8MB flash)
framework = arduino
monitor_speed = 115200
; Bảng phân vùng mặc định (4MB) chỉ cho app 1.25MB, mà riêng TFT_eSPI + font đã
; ăn ~73% -> quá sát trần. huge_app.csv cho 3MB (một slot app, không OTA).
; NVS vẫn ở 0x9000 kích thước 0x5000 y như bản cũ, nên MÃ IR ĐÃ HỌC KHÔNG MẤT.
;
; ĐỪNG ĐỔI SANG default_8MB.csv DÙ MODULE LÀ WROOM-32E-N8 (8MB) — bo sẽ KHÔNG
; BOOT, lặp `rst:0x3 (SW_RESET)` mỗi ~28ms và không in nổi một dòng log nào
; (kể cả log của 2nd-stage bootloader), rất dễ chẩn đoán nhầm thành chết phần
; cứng. Lý do: board `esp32doit-devkit-v1` khai board_upload.flash_size = 4MB,
; mà esptool đọc CHÍNH KHOÁ ĐÓ để ghi header ảnh — `board_build.flash_size`
; không thay được nó. Header ghi 4MB trong khi default_8MB.csv đặt app1 ở
; 0x340000, spiffs 0x670000, coredump 0x7F0000 (đều > 4MB) -> bootloader thấy
; phân vùng nằm ngoài vùng flash nó biết và bỏ cuộc trong im lặng.
; Đã kiểm chứng bằng firmware tối giản: bỏ hai dòng 8MB là boot ngay.
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    ; IRremoteESP8266 chạy được cả trên ESP32 (tên thư viện giữ theo lịch sử).
    ; Dùng nó thay vì tự bit-bang: đã có sẵn phần thu raw đủ dài cho khung điều
    ; hoà (dài hơn remote TV nhiều) và phần phát sendRaw() với sóng mang 38kHz.
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    ; DHT22. BẢN "for ESPx" CHỨ KHÔNG PHẢI `adafruit/DHT sensor library` —
    ; đã thử bản Adafruit và nó LÀM SẬP NODE khi chưa cắm cảm biến:
    ; vòng đọc 40 bit của nó chạy đủ 80 lượt expectPulse() KHÔNG THOÁT SỚM khi
    ; hết giờ, mà mỗi lượt đếm tới _maxcycles (~1ms quy ra chu kỳ CPU) bằng
    ; digitalRead() — tổng cộng hơn 1 GIÂY ngắt bị tắt trên lõi 1 -> "Interrupt
    ; wdt timeout on CPU1" -> panic -> lặp vô hạn, đúng lúc phần cứng chưa xong.
    ; Bản ESPx bấm giờ từng sườn bằng micros() với hạn 90µs và THOÁT NGAY khi
    ; quá hạn, nên không cắm cảm biến thì chỉ tắt ngắt ~90µs rồi trả lỗi.
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19.0
    bodmer/TFT_eSPI @ ^2.5.43
    ; TFT_eSPI vẫn giữ — nhưng chỉ còn làm DRIVER màn (init + đẩy pixel). Toàn bộ
    ; phần vẽ/bố cục/chạm nay do LVGL lo (src/ui/). Xem đầu ui.cpp cho lý do.
    lvgl/lvgl @ ^8.3.11
build_flags =
    -I../shared                    ; espnow-message.h dùng chung với node outdoor

    ; --- LVGL ---
    ; lv_conf.h đặt ở src/ chứ không sửa file trong thư viện: .pio/ bị xoá mỗi
    ; lần `pio pkg update`, sửa ở đó là mất lặng lẽ.
    -D LV_CONF_INCLUDE_SIMPLE=1
    ; Các file font sinh bởi lv_font_conv kiểm tra cờ này để chọn `#include
    ; "lvgl.h"` thay vì "lvgl/lvgl.h" — thiếu nó là đứt build ở fonts/*.c.
    -D LV_LVGL_H_INCLUDE_SIMPLE=1
    -I src
    -D IR_TX_PIN=5                 ; UART_2_TX = pad chân RX của A7680C, 3.3V thẳng; xem (2)
    -D IR_RX_PIN=17                ; UART_2_RX = pad chân TX của A7680C, 3.3V thẳng; xem (4)
    -D DHT_PIN=2                   ; UART_1_RX -> P3 qua TXS0104 — trở kéo 4.7k ĐẶT PHÍA P3; xem (3)
    ; --- TFT_eSPI: màn YT280S030 2.8" 240x320, SPI 4 dây, KHÔNG có MISO trên bo ---
    ;
    ; ST7789 CHỨ KHÔNG PHẢI ILI9341 — dù schematic ghi linh kiện là "ILI9341SP4".
    ; Module YT280S030 được nhà sản xuất bán với HAI tuỳ chọn chip (ILI9341 hoặc
    ; ST7789V, xem eya-display.com/yt280s030), và bo này lắp bản ST7789V.
    ; Triệu chứng khi khai nhầm ILI9341 rất dễ chẩn đoán sai vì màn KHÔNG chết
    ; hẳn: hai chip dùng chung nhiều lệnh nên fillRect/fillScreen vẫn ra đúng,
    ; chỉ phần chữ và hình vẽ là nhiễu/xé — nhìn như lỗi nhiễu SPI hoặc tranh
    ; chấp đa lõi. Cách phân biệt chắc chắn: bật cờ chẩn đoán trong ui.cpp
    ; (-D LCD_SELFTEST=1), nó vẽ hình mốc ngay trong setup() ở lõi 1, trước khi
    ; tác vụ giao diện lõi 0 chạy — loại hẳn nghi vấn đa lõi.
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    ; Thu tu mau BGR, khong phai RGB. Khong khai co nay thi TFT_eSPI chon
    ; TFT_MAD_RGB (240x320 khong bat CGRAM_OFFSET) va tam nay hoan vi R voi B:
    ; xanh #0055FF hien ra do cam #FF5500, xanh nhat #4D8DFF ra cam #FF8D4D.
    ; Trang va xanh la gan nhu khong doi nen loi nay RAT de bo sot — chi mau
    ; xanh duong moi lo ra, va de bi doc nham thanh "dao mau" hay "chon sai
    ; bang mau". Kiem bang colorSelfTest() trong src/ui/ui.cpp.
    -D TFT_RGB_ORDER=0
    -D TFT_WIDTH=240                ; kích thước GỐC của panel (dọc) — xoay ngang do TFT_ROTATION
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1                 ; J2 không nối MISO -> không đọc ngược được
    -D TFT_MOSI=18
    -D TFT_SCLK=22
    -D TFT_CS=19
    -D TFT_DC=21
    -D TFT_RST=23
    ; TFT_BL cố ý KHÔNG khai: đèn nền do BoardIo điều khiển bằng LEDC để chỉnh
    ; được độ sáng; để thư viện tự bật/tắt thì nó ghi đè PWM.
    -D LOAD_GLCD=1
    -D LOAD_GFXFF=1
    ; SMOOTH_FONT bật phần đọc font VLW — thứ DUY NHẤT trên TFT_eSPI hiện chữ
    ; tiếng Việt có dấu được, vì font GFX đánh chỉ số theo một byte (chỉ ASCII).
    ; Font nằm ở src/ui/fonts/, sinh bằng tools/make_vlw.py.
    ; LƯU Ý: khi đã loadFont() thì setFreeFont() VÀ setTextFont() đều bị bỏ qua —
    ; mọi chữ trên màn phải đến từ VLW, nên có đủ 3 cỡ thay cho 3 font GFX cũ.
    -D SMOOTH_FONT=1
    ; 27MHz chứ không phải 40MHz: chân 18/22 KHÔNG phải chân IOMUX của VSPI nên
    ; tín hiệu đi vòng qua ma trận GPIO, 40MHz là sát trần và gây sọc/vỡ hình
    ; lúc vẽ nhanh (đã gặp trên bo thật). Nhịp vẽ lại của giao diện là 200ms,
    ; chậm hơn 27MHz rất nhiều, nên hạ xuống không hề làm màn giật.
    -D SPI_FREQUENCY=27000000