; Aircon — ESP32 DevKit V1 · node TRONG NHÀ (indoor), kiêm luôn MASTER.
;
; Node này gộp 3 vai trò vào một bo (xem ../README.md §6):
;   1. Đọc DHT -> telemetry (t_in/h_in cho thuật toán comfort)
;   2. Phát/học hồng ngoại -> điều khiển máy lạnh
;   3. Nhận ESP-NOW từ node outdoor rồi chuyển tiếp lên MQTT
;
; VÌ SAO node này nối WiFi/MQTT TRỰC TIẾP chứ không làm ESP-NOW slave:
;   lệnh từ backend mang theo `ir_raw` — mảng vài trăm mốc thời gian µs, cỡ
;   vài KB (command_publisher.py). ESP-NOW giới hạn 250 byte/gói, muốn đi qua
;   master thì phải tự viết giao thức chia mảnh + ghép lại + báo thiếu mảnh.
;   Nối MQTT thẳng thì broker đã lo sẵn việc đó.
;
; HAI BO, MỘT MÃ NGUỒN — chọn env theo bo đang cắm:
;   pio run -e esp32-devkit -t upload --upload-port COMx   ; ESP32 DevKit V1
;   pio run -e esp32-s3     -t upload --upload-port COMx   ; ESP32-S3 DevKitC
;
; Không tách thành hai thư mục firmware: hai bản sao của cùng logic IR/ESP-NOW
; sẽ trôi xa nhau theo thời gian (dự án này đã có sẵn một vết như thế, xem
; comment trong web/static/app.js). Khác biệt giữa hai bo chỉ là SƠ ĐỒ CHÂN,
; nên xử lý bằng build_flags là đủ.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; src/ui/ chỉ tồn tại cho bo có màn hình. PlatformIO mặc định biên dịch MỌI file
; trong src/ cho MỌI env, nên không loại ra thì hai bo cũ (không có TFT_eSPI
; trong lib_deps) gãy ngay ở #include. Env qrbox-touch mở lại bằng dòng của nó.
build_src_filter = +<*> -<ui/>
build_flags =
    -I../shared        ; espnow-message.h dùng chung với node outdoor
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    ; IRremoteESP8266 chạy được cả trên ESP32 (tên thư viện giữ theo lịch sử).
    ; Dùng nó thay vì tự bit-bang: đã có sẵn phần thu raw đủ dài cho khung điều
    ; hoà (dài hơn remote TV nhiều) và phần phát sendRaw() với sóng mang 38kHz.
    crankyoldgit/IRremoteESP8266 @ ^2.8.6

; ---------------------------------------------------------------------------
;  ESP32 DevKit V1 (ESP32-WROOM-32, 30 chân) — chân mặc định trong config.h
; ---------------------------------------------------------------------------
[env:esp32-devkit]
board = esp32doit-devkit-v1

; ---------------------------------------------------------------------------
;  QR Box Advance Touch Screen — bo có màn 2.8" ILI9341 + cảm ứng I2C + DS1307.
;  Bo này THAY THẾ ESP32 DevKit V1 cho node trong nhà; thiết kế giao diện và
;  cách đọc ngược sơ đồ chân từ schematic: ../Interface/README.md
;
;  Vì sao IR nhảy sang GPIO15/2: bo dùng hết sạch GPIO cho màn/cảm ứng/RTC/4G,
;  chỉ còn cổng P3 (EXTERNAL UART) là đưa hai chân ra header — và chúng đi qua
;  bộ dịch mức TXS0104 nên module IR chạy được ở 5V (phát xa hơn 3.3V).
;  Chân DHT thì KHÔNG còn: GPIO4 đã là I2C SCL. Xem Interface/README.md §3.
;
;  Cờ TFT_* phải nằm ở đây chứ không trong config.h: TFT_eSPI đọc chúng lúc
;  biên dịch THƯ VIỆN. Cũng không sửa User_Setup.h của thư viện — file đó nằm
;  trong .pio/, `pio pkg update` là mất sạch.
;
;    pio run -e qrbox-touch -t upload --upload-port COMx   ; USB-TTL cắm vào P3
; ---------------------------------------------------------------------------
[env:qrbox-touch]
board = esp32doit-devkit-v1        ; cùng ESP32-WROOM-32 (bản N8, 8MB flash)
board_build.flash_size = 8MB
; Khai 8MB thôi thì bảng phân vùng vẫn là bản 4MB -> ứng dụng bị kẹt ở 1.3MB, mà
; riêng TFT_eSPI + font đã ăn hết ~73%. default_8MB.csv cho 3.3MB.
; NVS vẫn ở 0x9000 kích thước 0x5000 y như bản cũ, nên MÃ IR ĐÃ HỌC KHÔNG MẤT.
board_build.partitions = default_8MB.csv
build_src_filter = +<*>            ; mở lại src/ui/ — chỉ env này có màn hình
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    ${env.build_flags}
    -D HAS_DISPLAY=1
    -D IR_TX_PIN=15                ; P3 chân UART_1_TX, qua TXS0104 -> 5V
    -D IR_RX_PIN=2                 ; P3 chân UART_1_RX, qua TXS0104 -> 5V
    ; --- TFT_eSPI: ILI9341 320x240, SPI 4 dây, KHÔNG có MISO trên bo ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1                 ; J2 không nối MISO -> không đọc ngược được
    -D TFT_MOSI=18
    -D TFT_SCLK=22
    -D TFT_CS=19
    -D TFT_DC=21
    -D TFT_RST=23
    ; TFT_BL cố ý KHÔNG khai: đèn nền do BoardIo điều khiển bằng LEDC để chỉnh
    ; được độ sáng; để thư viện tự bật/tắt thì nó ghi đè PWM.
    -D LOAD_GLCD=1
    -D LOAD_GFXFF=1
    ; 40MHz là trần an toàn khi SPI đi qua ma trận GPIO (18/22 không phải chân
    ; IOMUX của VSPI). Thấy sọc nhiễu lúc vẽ nhanh thì hạ xuống 27000000.
    -D SPI_FREQUENCY=40000000

; ---------------------------------------------------------------------------
;  ESP32-S3 DevKitC-1 — PHẢI đổi chân IR.
;  GPIO26-32 trên nhiều module S3 nối SPI flash/PSRAM: dùng làm IR thì bo không
;  boot hoặc chạy chập chờn. GPIO15/16 an toàn, không phải chân strapping và
;  không đụng USB (19/20) hay UART0 (43/44).
;  DHT giữ GPIO4 — chân này đã chạy thật trên bo S3 của dự án.
; ---------------------------------------------------------------------------
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D IR_RX_PIN=15
    -D IR_TX_PIN=16
    -D DHT_PIN=4
