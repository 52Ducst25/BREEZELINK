; Aircon — node TRONG NHÀ (indoor), kiêm luôn MASTER.
; Bo: QR Box Advance Touch Screen (ESP32-WROOM-32E-N8 + màn 2.8" YT280S030/ST7789).
;
; Node này gộp 3 vai trò vào một bo (xem ../README.md §6):
;   1. Đọc nhiệt/ẩm -> telemetry (t_in/h_in cho thuật toán comfort)
;   2. Phát/học hồng ngoại -> điều khiển máy lạnh
;   3. Nhận ESP-NOW từ node outdoor rồi chuyển tiếp lên MQTT
;
; VÌ SAO node này nối WiFi/MQTT TRỰC TIẾP chứ không làm ESP-NOW slave:
;   lệnh từ backend mang theo `ir_raw` — mảng vài trăm mốc thời gian µs, cỡ
;   vài KB (command_publisher.py). ESP-NOW giới hạn 250 byte/gói, muốn đi qua
;   master thì phải tự viết giao thức chia mảnh + ghép lại + báo thiếu mảnh.
;   Nối MQTT thẳng thì broker đã lo sẵn việc đó.
;
;   pio run -e qrbox-touch -t upload --upload-port COMx   ; USB-TTL cắm vào P3
;
; MỘT BO, MỘT ENV — trước đây file này còn hai env nữa (esp32-devkit cho ESP32
; DevKit V1 trần, esp32-s3 cho ESP32-S3 DevKitC) từ giai đoạn thử nghiệm. Cả hai
; đã bỏ: dự án chốt chạy trên bo QR Box Advance, giữ thêm env cho bo không có
; trong tay chỉ tạo ra cấu hình không ai build và không ai kiểm chứng được.
; Cần quay lại bo trần thì xem lịch sử git (commit trước bản này).
; ---------------------------------------------------------------------------
;  Vì sao chân IR nằm ở GPIO17/5 chứ không phải 26/27 như bo DevKit:
;  bo này dùng hết sạch GPIO cho màn/cảm ứng/RTC/4G — GPIO26 là opto ra (không
;  phát nổi sóng mang 38kHz), GPIO27 là đèn nền.
;
;  CẢ HAI chân IR mượn của module 4G A7680C — module mà "dự án này không dùng"
;  (../Interface/README.md §1) nên không hàn lên bo, hai chân bỏ không:
;    IR phát -> GPIO17 = UART_2_RX (nối chân TX của A7680C), trở kéo lên 100k R5
;    IR thu  -> GPIO5  = UART_2_TX (nối chân RX của A7680C), trở kéo lên 100k R6
;  Cả hai chạy 3.3V THẲNG: đường UART_2 KHÔNG đi qua TXS0104, nên IR không phụ
;  thuộc EN_LEVEL_SHIFT. Không ra header — phải hàn dây vào pad chân module.
;  ĐIỀU KIỆN BẮT BUỘC: KHÔNG HÀN MODULE A7680C lên bo.
;  Chân DHT thì KHÔNG còn: GPIO4 đã là I2C SCL -> nhiệt/ẩm đo bằng SHT3x trên
;  bus I2C. Xem ../Interface/README.md §3.
;
;  Cờ TFT_* phải nằm ở đây chứ không trong config.h: TFT_eSPI đọc chúng lúc
;  biên dịch THƯ VIỆN. Cũng không sửa User_Setup.h của thư viện — file đó nằm
;  trong .pio/, `pio pkg update` là mất sạch.
; ---------------------------------------------------------------------------
[env:qrbox-touch]
platform = espressif32
board = esp32doit-devkit-v1        ; cùng ESP32-WROOM-32 (bản N8, 8MB flash)
framework = arduino
monitor_speed = 115200
; Bảng phân vùng mặc định (4MB) chỉ cho app 1.25MB, mà riêng TFT_eSPI + font đã
; ăn ~73% -> quá sát trần. huge_app.csv cho 3MB (một slot app, không OTA).
; NVS vẫn ở 0x9000 kích thước 0x5000 y như bản cũ, nên MÃ IR ĐÃ HỌC KHÔNG MẤT.
;
; ĐỪNG ĐỔI SANG default_8MB.csv DÙ MODULE LÀ WROOM-32E-N8 (8MB) — bo sẽ KHÔNG
; BOOT, lặp `rst:0x3 (SW_RESET)` mỗi ~28ms và không in nổi một dòng log nào
; (kể cả log của 2nd-stage bootloader), rất dễ chẩn đoán nhầm thành chết phần
; cứng. Lý do: board `esp32doit-devkit-v1` khai board_upload.flash_size = 4MB,
; mà esptool đọc CHÍNH KHOÁ ĐÓ để ghi header ảnh — `board_build.flash_size`
; không thay được nó. Header ghi 4MB trong khi default_8MB.csv đặt app1 ở
; 0x340000, spiffs 0x670000, coredump 0x7F0000 (đều > 4MB) -> bootloader thấy
; phân vùng nằm ngoài vùng flash nó biết và bỏ cuộc trong im lặng.
; Đã kiểm chứng bằng firmware tối giản: bỏ hai dòng 8MB là boot ngay.
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    ; IRremoteESP8266 chạy được cả trên ESP32 (tên thư viện giữ theo lịch sử).
    ; Dùng nó thay vì tự bit-bang: đã có sẵn phần thu raw đủ dài cho khung điều
    ; hoà (dài hơn remote TV nhiều) và phần phát sendRaw() với sóng mang 38kHz.
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    bodmer/TFT_eSPI @ ^2.5.43
    ; TFT_eSPI vẫn giữ — nhưng chỉ còn làm DRIVER màn (init + đẩy pixel). Toàn bộ
    ; phần vẽ/bố cục/chạm nay do LVGL lo (src/ui/). Xem đầu ui.cpp cho lý do.
    lvgl/lvgl @ ^8.3.11
build_flags =
    -I../shared                    ; espnow-message.h dùng chung với node outdoor

    ; --- LVGL ---
    ; lv_conf.h đặt ở src/ chứ không sửa file trong thư viện: .pio/ bị xoá mỗi
    ; lần `pio pkg update`, sửa ở đó là mất lặng lẽ.
    -D LV_CONF_INCLUDE_SIMPLE=1
    ; Các file font sinh bởi lv_font_conv kiểm tra cờ này để chọn `#include
    ; "lvgl.h"` thay vì "lvgl/lvgl.h" — thiếu nó là đứt build ở fonts/*.c.
    -D LV_LVGL_H_INCLUDE_SIMPLE=1
    -I src
    -D IR_TX_PIN=17                ; chân TX của module A7680C — UART_2 không qua TXS0104, 3.3V trực tiếp
    -D IR_RX_PIN=5                 ; chân RX của module A7680C — UART_2, 3.3V trực tiếp
    ; --- TFT_eSPI: màn YT280S030 2.8" 240x320, SPI 4 dây, KHÔNG có MISO trên bo ---
    ;
    ; ST7789 CHỨ KHÔNG PHẢI ILI9341 — dù schematic ghi linh kiện là "ILI9341SP4".
    ; Module YT280S030 được nhà sản xuất bán với HAI tuỳ chọn chip (ILI9341 hoặc
    ; ST7789V, xem eya-display.com/yt280s030), và bo này lắp bản ST7789V.
    ; Triệu chứng khi khai nhầm ILI9341 rất dễ chẩn đoán sai vì màn KHÔNG chết
    ; hẳn: hai chip dùng chung nhiều lệnh nên fillRect/fillScreen vẫn ra đúng,
    ; chỉ phần chữ và hình vẽ là nhiễu/xé — nhìn như lỗi nhiễu SPI hoặc tranh
    ; chấp đa lõi. Cách phân biệt chắc chắn: bật cờ chẩn đoán trong ui.cpp
    ; (-D LCD_SELFTEST=1), nó vẽ hình mốc ngay trong setup() ở lõi 1, trước khi
    ; tác vụ giao diện lõi 0 chạy — loại hẳn nghi vấn đa lõi.
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    ; Thu tu mau BGR, khong phai RGB. Khong khai co nay thi TFT_eSPI chon
    ; TFT_MAD_RGB (240x320 khong bat CGRAM_OFFSET) va tam nay hoan vi R voi B:
    ; xanh #0055FF hien ra do cam #FF5500, xanh nhat #4D8DFF ra cam #FF8D4D.
    ; Trang va xanh la gan nhu khong doi nen loi nay RAT de bo sot — chi mau
    ; xanh duong moi lo ra, va de bi doc nham thanh "dao mau" hay "chon sai
    ; bang mau". Kiem bang colorSelfTest() trong src/ui/ui.cpp.
    -D TFT_RGB_ORDER=0
    -D TFT_WIDTH=240                ; kích thước GỐC của panel (dọc) — xoay ngang do TFT_ROTATION
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1                 ; J2 không nối MISO -> không đọc ngược được
    -D TFT_MOSI=18
    -D TFT_SCLK=22
    -D TFT_CS=19
    -D TFT_DC=21
    -D TFT_RST=23
    ; TFT_BL cố ý KHÔNG khai: đèn nền do BoardIo điều khiển bằng LEDC để chỉnh
    ; được độ sáng; để thư viện tự bật/tắt thì nó ghi đè PWM.
    -D LOAD_GLCD=1
    -D LOAD_GFXFF=1
    ; SMOOTH_FONT bật phần đọc font VLW — thứ DUY NHẤT trên TFT_eSPI hiện chữ
    ; tiếng Việt có dấu được, vì font GFX đánh chỉ số theo một byte (chỉ ASCII).
    ; Font nằm ở src/ui/fonts/, sinh bằng tools/make_vlw.py.
    ; LƯU Ý: khi đã loadFont() thì setFreeFont() VÀ setTextFont() đều bị bỏ qua —
    ; mọi chữ trên màn phải đến từ VLW, nên có đủ 3 cỡ thay cho 3 font GFX cũ.
    -D SMOOTH_FONT=1
    ; 27MHz chứ không phải 40MHz: chân 18/22 KHÔNG phải chân IOMUX của VSPI nên
    ; tín hiệu đi vòng qua ma trận GPIO, 40MHz là sát trần và gây sọc/vỡ hình
    ; lúc vẽ nhanh (đã gặp trên bo thật). Nhịp vẽ lại của giao diện là 200ms,
    ; chậm hơn 27MHz rất nhiều, nên hạ xuống không hề làm màn giật.
    -D SPI_FREQUENCY=27000000
