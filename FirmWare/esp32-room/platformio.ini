; BreezeLink — node CẢM BIẾN GÓC PHÒNG (room).
; Bo: ESP32-C3-DevKitM-1 (ESP32-C3-MINI-1, 4MB flash, RISC-V một lõi).
;
; Bốn bo giống hệt nhau đặt ở bốn góc một phòng, chỉ khác DEVICE_UUID (và
; ROOM_CORNER, thuần nhãn) trong src/config.h. Không WiFi, không MQTT — chúng bắn
; ESP-NOW về gateway đặt gần máy lạnh.
;
; MỖI BO MỘT ENV, khai trong `nodes.ini` (gitignore; bản mẫu nodes.ini.example):
;
;     pio run -e ss1 -t upload --upload-port COM30
;     pio device monitor -e ss1 --port COM30
;
; Section dưới đây KHÔNG phải env — nó là phần dùng chung mà bốn env kia `extends`.
; Không có `[env:...]` nào trong file này là có chủ đích: `pio run` trần sẽ dựng cả
; bốn bo, và đó đúng là thứ ta muốn khi kiểm tra một thay đổi có gãy bo nào không.
;
; ĐỪNG CHẠY `pio pkg install` ĐỂ THÊM THƯ VIỆN — nó viết lại file này và xoá sạch
; mọi chú thích. Thêm tay vào lib_deps rồi để `pio run` tự tải. (Bài học đã trả
; giá một lần ở esp32-indoor/platformio.ini.)
; ---------------------------------------------------------------------------
;  CHỌN CHÂN TRÊN ESP32-C3 — những chân PHẢI TRÁNH:
;
;    GPIO2, GPIO8, GPIO9   chân strapping. GPIO9 là nút BOOT: kéo thấp lúc reset
;                          là vào bootloader. Treo DHT22 (có trở kéo 4.7k lên
;                          3.3V) vào GPIO9 thì ngược lại — giữ nó CAO, và bo mất
;                          khả năng vào chế độ nạp bằng nút.
;    GPIO18, GPIO19        USB D-/D+. Dùng làm GPIO là mất cổng USB, mà
;                          DevKitM-1 chỉ có đúng đường đó để nạp.
;    GPIO11..17            nối flash SPI trong module. Đụng vào là bo chết ngay.
;    GPIO20, GPIO21        UART0 (log serial). Còn dùng được nhưng mất log.
;
;  GPIO4 sạch: không strapping, không phần cứng nào giữ chỗ, có ra header.
;
;  DHT22 LÀ GIAO THỨC MỘT DÂY HAI CHIỀU — bắt buộc có trở kéo 4.7k lên 3.3V trên
;  đường dữ liệu. Thiếu trở thì đọc được lúc được lúc không (checksum bắt được
;  nên KHÔNG ra số sai, chỉ ra NaN xen kẽ) — triệu chứng rất giống dây tuột.
;
;  NUÔI DHT22 BẰNG 3.3V, KHÔNG 5V: chân ESP32-C3 không chịu quá áp, mà DHT22 nuôi
;  5V sẽ lái đường dữ liệu lên gần 5V.
; ---------------------------------------------------------------------------
[platformio]
; Bốn env (ss1..ss4) nằm ở file riêng vì chúng chứa DEVICE_UUID của khách hàng
; thật. Thiếu file này thì `pio run` báo lỗi ngay — cố ý: thà đứng lại còn hơn
; dựng ra một firmware không có danh tính rồi nạp lên bo.
extra_configs = nodes.ini

[room_base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    ; DHT22. BẢN "for ESPx" CHỨ KHÔNG PHẢI `adafruit/DHT sensor library` — bản
    ; Adafruit tắt ngắt hơn MỘT GIÂY khi chưa cắm cảm biến (vòng 80 lượt
    ; expectPulse() không thoát sớm). Trên ESP32 hai lõi việc đó đã gây panic
    ; lõi 1; trên C3 MỘT LÕI thì tệ hơn — ngăn xếp WiFi/ESP-NOW chạy ngay trên
    ; lõi đó. Lý do đầy đủ nằm ở ../esp32-indoor/platformio.ini.
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19.0
    ; WiFi PHẢI khai tường minh dù không dòng nào trong src/ include nó: bộ dò
    ; phụ thuộc của PlatformIO chỉ quét include trong src/ và trong các thư mục
    ; thư viện, mà `<WiFi.h>` nay nằm trong ../shared/espnow-slave-radio.h —
    ; không thuộc cả hai. Thiếu dòng này là đứt build ngay ở "WiFi.h: No such
    ; file or directory", mà dòng lỗi lại trỏ vào file shared nên rất dễ đi tìm
    ; nhầm sang phía header.
    WiFi
build_flags =
    ; espnow-message.h + espnow-slave-radio.h dùng chung với node ngoài trời và
    ; gateway. ESP-NOW nằm sẵn trong ESP-IDF nên KHÔNG cần thư viện ngoài nào.
    -I../shared
    -D DHT_PIN=4               ; xem khối chú thích chọn chân ở trên
    ; ĐƯA `Serial` RA CỔNG USB. Thiếu hai cờ này thì Serial đi ra UART0 (GPIO20/21)
    ; — trên bo nối bằng USB-Serial/JTAG gốc (esptool in `USB mode:
    ; USB-Serial/JTAG`, VID 303A) thì UART0 KHÔNG nối vào cổng USB nào cả, nên log
    ; chạy vào chỗ không ai đọc được. Triệu chứng rất dễ chẩn đoán nhầm: nạp báo
    ; thành công, hash verify xong, mà mở serial monitor thì im như bo chết.
    ;
    ; Board `esp32-c3-devkitm-1` của PlatformIO không bật sẵn (extra_flags chỉ có
    ; -DARDUINO_ESP32C3_DEV) vì bản DevKitM-1 chính hãng có chip CP2102N gắn vào
    ; UART0; bo dùng ở đây thì không.
    ;
    ; Vô hại khi chạy ngoài hiện trường: không cắm USB thì Serial.print() rơi vào
    ; hư vô chứ không chặn vòng lặp.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
