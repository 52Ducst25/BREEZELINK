; ============================================================================
;  BreezeLink — NODE ĐỘ ẨM  ·  tự bật máy xông tinh dầu khi phòng khô
; ----------------------------------------------------------------------------
;   pio run -e esp32-humidity -t upload --upload-port COM7
;   pio device monitor -p COM7 -b 115200
; ============================================================================
;  BO ĐÃ ĐỌC TRÊN THỰC TẾ (esptool chip_id/flash_id, cổng COM7):
;
;      Chip     ESP32-D0WD-V3 rev v3.1   (Xtensa HAI LÕI, WiFi + BT)
;      Flash    4 MB, 3.3V do strapping  (Manufacturer 68 / Device 4016)
;      Thạch anh 40 MHz
;      MAC      28:05:A5:33:E4:B8
;      Cầu USB  Silicon Labs CP210x      <-- KHÔNG phải USB gốc
;
;  KHÔNG PHẢI S3, KHÔNG PHẢI C3. Đây là ESP32 cổ điển — cùng họ với node ngoài
;  trời của dự án, khác hẳn hai bo kia. Ba hệ quả bắt buộc phải nhớ:
;
;  1. TUYỆT ĐỐI KHÔNG khai -D ARDUINO_USB_MODE / -D ARDUINO_USB_CDC_ON_BOOT.
;     Hai cờ đó có ở esp32-room và esp32-s3-panel vì hai bo ấy dùng USB GỐC.
;     Bo này đi qua chip cầu CP210x, tức console NẰM CHÍNH TRÊN UART0
;     (GPIO1/GPIO3). Khai hai cờ đó vào là Serial bị đẩy sang một cổng USB
;     không tồn tại: nạp vẫn báo thành công, mà monitor im như bo chết.
;
;  2. GPIO1 và GPIO3 ĐÃ CÓ CHỦ (UART0 = console). Panel đặt IR lên IO2/IO3 —
;     BÊ NGUYÊN SANG ĐÂY LÀ MẤT SERIAL. Xem src/settings.h §1 để biết chân đã
;     chọn lại thế nào.
;
;  3. Không cần bảng phân vùng riêng. Firmware này không có LVGL, không WiFi,
;     không MQTT, và kho mã IR chỉ giữ ĐÚNG HAI khung (BẬT/TẮT) thay vì 18 tổ
;     hợp điều hoà — nên NVS 20 KB mặc định là thừa sức. Nhờ vậy tránh được cả
;     cái bẫy `board_upload.offset_address` đã mất nhiều giờ ở hai bo kia.
; ----------------------------------------------------------------------------
;  THƯ MỤC NÀY TỰ CHỨA HOÀN TOÀN — CÓ CHỦ ĐÍCH
;
;  Nó KHÔNG `src_dir` và KHÔNG `build_src_filter` sang ../esp32-s3-panel/ như
;  esp32-qrbox và esp32-s3-gateway vẫn làm. Lý do: hai env kia là BA BO CÙNG
;  ĐÓNG MỘT VAI (panel treo tường), nên chúng bắt buộc phải là một bản mã.
;  Bo này đóng vai KHÁC HẲN — nó không nối cloud, không thi hành lệnh của
;  server, không có màn. Buộc nó dùng chung mã với panel là kéo cả PubSubClient,
;  ArduinoJson, UART UNO Q và vòng đời lệnh vào một thiết bị không dùng gì
;  trong số đó.
;
;  CÁI GIÁ, NÓI THẲNG: phần thu/phát IR ở đây là bản VIẾT LẠI GỌN của
;  ../esp32-s3-panel/src/ir-io.cpp. Hai bài học đắt nhất của file đó đã được
;  mang sang và ghi rõ nguồn trong src/ir-remote.cpp. Sửa lỗi ở một bên thì
;  NGÓ SANG BÊN KIA.
;
;  ĐỪNG CHẠY `pio pkg install` ĐỂ THÊM THƯ VIỆN — nó viết lại file này và xoá
;  sạch chú thích. Thêm tay vào lib_deps rồi để `pio run` tự tải.
; ============================================================================

[env:esp32-humidity]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; HIỆN LẠI KÝ TỰ MÌNH GÕ. Mặc định miniterm KHÔNG echo, mà bo này điều khiển
; hoàn toàn bằng lệnh gõ tay (`watch`, `learn`, `on`, `off`...). Gõ mà màn hình
; không đổi gì thì ai cũng kết luận "monitor không cho gõ" và đi tìm ở chỗ khác
; — thực ra lệnh vẫn tới nơi và vẫn chạy.
;
; Bo KHÔNG tự echo được: nó chia sẻ đúng một đường UART với luồng log 5 giây
; một dòng, echo từ phía firmware sẽ chen vào giữa các dòng log. Để miniterm lo
; là đúng chỗ.
monitor_echo = yes

lib_deps =
    ; DHT22. BẢN "for ESPx" CHỨ KHÔNG PHẢI `adafruit/DHT sensor library`.
    ; Bản Adafruit tắt ngắt HƠN MỘT GIÂY khi chưa cắm cảm biến (vòng 80 lượt
    ; expectPulse() không thoát sớm) và việc đó đã gây panic lõi 1 trên đúng
    ; loại ESP32 hai lõi này. Node góc phòng đã đổi sang DHTesp vì lý do đó;
    ; node ngoài trời thì chưa (nó vẫn để adafruit/DHT ^1.4.6) — đừng lấy
    ; esp32-outdoor làm mẫu ở dòng này.
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19.0

    ; Thu + phát hồng ngoại. Tên thư viện giữ theo lịch sử, chạy tốt trên ESP32.
    crankyoldgit/IRremoteESP8266 @ ^2.8.6

    ; NVS — giữ hai khung IR đã học và trạng thái máy qua mất điện.
    Preferences

    ; PHẢI KHAI TƯỜNG MINH dù chỉ dùng đúng một dòng WiFi.mode(WIFI_OFF).
    ; Bộ dò phụ thuộc của PlatformIO có thấy <WiFi.h> trong src/ nên thực ra
    ; suy ra được, nhưng khai rõ thì đọc lib_deps là biết bo đụng tới gì.
    WiFi

build_flags =
    -I src
