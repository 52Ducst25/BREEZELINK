; Aircon — ESP8266 node NGOÀI TRỜI.
;
; HAI cách chạy, chọn bằng env:
;   pio run -e esp8266-espnow -t upload   ; MẶC ĐỊNH: vai trò SLAVE, gửi ESP-NOW
;                                         ; về node master (ESP32-S3). Không dùng WiFi.
;   pio run -e esp8266-wifi   -t upload   ; DỰ PHÒNG: tự nối WiFi + MQTT thẳng lên
;                                         ; cloud. Dùng khi ESP-NOW trục trặc.
;
; Board mặc định = NodeMCU 1.0 (ESP-12E). Wemos/LOLIN D1 mini -> board = d1_mini.
[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags = -I../shared          ; espnow-message.h dùng chung với node master
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8

; Mỗi env chỉ biên dịch ĐÚNG MỘT file main — hai file đều định nghĩa setup()/loop()
; nên biên dịch cả hai sẽ lỗi trùng ký hiệu.
[env:esp8266-espnow]
build_src_filter = +<*> -<main-wifi-direct.cpp>

[env:esp8266-wifi]
build_src_filter = +<*> -<main-espnow-slave.cpp>
