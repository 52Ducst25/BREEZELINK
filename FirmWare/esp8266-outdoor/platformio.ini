; Aircon — ESP8266 node NGOÀI TRỜI (outdoor).
; Bản TEST: đọc DHT11 -> đẩy telemetry lên EMQX (MQTTS 8883) trực tiếp.
; (Chạy thật: node ngoài trời gửi về master qua ESP-NOW — bước sau, xem ../README.md.)
;
; Board mặc định = NodeMCU 1.0 (ESP-12E), loại ESP8266 phổ biến nhất.
;   - Nếu bạn dùng Wemos/LOLIN D1 mini: đổi thành  board = d1_mini
;   - Nếu dùng NodeMCU đời cũ (ESP-12):            board = nodemcu
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
; ESP8266WiFi + BearSSL (WiFiClientSecure) có sẵn trong core ESP8266.
