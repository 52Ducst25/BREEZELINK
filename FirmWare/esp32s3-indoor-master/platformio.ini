; Aircon — ESP32-S3 node MASTER / TRONG NHÀ (indoor).
; Bản TEST: đọc DHT11 -> đẩy telemetry lên EMQX (MQTTS 8883) trực tiếp.
; (IR blaster + relay ESP-NOW cho node slave là bước sau — xem ../README.md.)
;
; Board mặc định = ESP32-S3-DevKitC-1 (chip ESP32-S3, phổ biến nhất). Nếu bo
; của bạn khác, đổi dòng `board =` cho đúng (vd: lolin_s3, adafruit_feather_esp32s3).
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I../shared        ; espnow-message.h dùng chung với node slave
    ; Bo S3 có 2 cổng USB: cổng ghi "UART" (qua chip CH340/CP210x) dùng ngay,
    ; KHÔNG cần cờ này. Nếu bạn cắm cổng "USB" (USB-native của chip) và Serial
    ; Monitor không ra chữ, BỎ dấu ; ở dòng dưới rồi build lại.
    ; -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
; WiFiClientSecure có sẵn trong core ESP32 — không cần thêm vào lib_deps.
