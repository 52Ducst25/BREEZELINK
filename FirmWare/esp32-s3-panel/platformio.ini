; ============================================================================
;  BreezeLink — PANEL TREO TƯỜNG CHÍNH THỨC
;  Bo: ESP32-S3 2.8" (màn ILI9341V + cảm ứng FT6336G + mic/loa I2S + thẻ SD)
; ----------------------------------------------------------------------------
;   pio run -e esp32s3-panel -t upload --upload-port COMx
;
;  Đọc README.md cạnh file này TRƯỚC KHI HÀN — có sơ đồ dây và ba thứ bắt buộc
;  phải đo trên bo thật trước khi tin vào cấu hình dưới đây.
; ============================================================================
;  THƯ MỤC NÀY GIỮ MÃ NGUỒN THẬT CỦA PANEL — VÀ CHỈ CÓ MỘT BẢN
; ----------------------------------------------------------------------------
;  src/ ở đây là bản DUY NHẤT. Hai env còn lại KHÔNG có mã riêng, chúng trỏ
;  ngược về đây:
;      ../esp32-qrbox/     bo QR Box cũ  (src_dir = ../esp32-s3-panel/src)
;      ../esp32-s3-gateway/ bo gỡ lỗi     (build_src_filter trỏ sang đây)
;
;  ĐỪNG BAO GIỜ CHÉP src/ SANG THƯ MỤC KHÁC. Chép là tạo ra HAI panel: logic thi
;  hành lệnh, chống trùng req_id, xin lại mã IR, ranh giới đề xuất/lệnh của UNO Q
;  — toàn những chỗ tinh vi mà mỗi cái đều đã trả giá một lần để viết cho đúng.
;  Hai bản sao lệch nhau ngay lần sửa thứ nhất, và triệu chứng là bo này chạy
;  đúng còn bo kia thì không, không có cách nào biết bên nào mới là bản thật.
;
;  => SỬA src/*.cpp LÀ ẢNH HƯỞNG CẢ BA ENV. Chỗ nào thật sự khác nhau giữa các
;     bo thì để ở src/board-pins.h (chọn bằng cờ -D BOARD_*), KHÔNG rải #ifdef
;     vào mã.
; ----------------------------------------------------------------------------
;  src/config.h — MỘT FILE CHO MỌI BO PANEL
;
;  Cố ý: các bo panel THAY THẾ NHAU chứ không chạy cùng lúc, nên phải dùng ĐÚNG
;  một DEVICE_UUID và ĐÚNG một token MQTT của hàng `devices` đó trên web. Mỗi bo
;  một bản sao là có hai file cùng chứa một mật khẩu MQTT, và chắc chắn sẽ lệch.
;
;  File này BỊ GITIGNORE (FirmWare/.gitignore, mẫu `*/src/config.h`) vì chứa mật
;  khẩu WiFi + token MQTT thật. Bản được commit là src/config.h.example.
; ============================================================================

[env:esp32s3-panel]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Flash: KHAI 4MB LÀ CỐ Ý, KHÔNG PHẢI CHƯA KIỂM ---------------------------
; Chưa xác nhận bo này là bản mấy MB. Khai THIẾU thì vô hại (chỉ bỏ phí phần
; flash dư), khai THỪA thì bootloader thấy phân vùng nằm ngoài vùng flash nó biết
; và BỎ CUỘC TRONG IM LẶNG — lặp rst vô hạn, không in nổi một dòng log, rất dễ
; chẩn đoán nhầm thành chết phần cứng. Đúng cái bẫy đã mất nhiều giờ ở
; ../esp32-qrbox/platformio.ini. Bảng phân vùng dưới ~3,3MB nên lọt 4MB.
;
; Muốn dùng hết flash thì đọc số thật rồi mới nới:
;     esptool.py --port COMx flash_id
; và PHẢI sửa CẢ HAI khoá — esptool đọc `board_upload`, build đọc `board_build`.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

; PSRAM CỐ Ý KHÔNG KHAI. Giao diện không dùng PSRAM: bộ đệm vẽ LVGL xin RAM TRONG
; có DMA (heap_caps_malloc MALLOC_CAP_DMA trong ui/ui.cpp), mà PSRAM không thoả.
; Khai sai kiểu (OPI/QSPI) chỉ làm Arduino in cảnh báo lúc boot chứ không hỏng gì
; — nhưng khai đúng cũng chẳng được thêm gì, nên không đoán.

; Dùng chung bảng phân vùng với QR Box: kho mã IR nằm trong NVS và bản mặc định
; 20KB chỉ chứa nổi ~13 khung điều hoà, mà giao diện hỗ trợ 18 tổ hợp.
; ĐỔI BO NHƯNG KHÔNG ĐỔI BẢNG PHÂN VÙNG => mã IR đã học vẫn nằm đúng chỗ cũ.
board_build.partitions = partitions-BreezeLink.csv
; PHẢI ĐI KÈM DÒNG TRÊN: PlatformIO không đọc bảng phân vùng để biết ghi app vào
; đâu, nó lấy từ đúng khoá này. Bảng đó đẩy `factory` xuống 0x20000. Quên là LẶP
; `rst:0x3 (SW_RESET)` VÔ HẠN, không in nổi một dòng log.
board_upload.offset_address = 0x20000

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    ; IRremoteESP8266 chạy được cả trên ESP32 (tên thư viện giữ theo lịch sử).
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    ; TFT_eSPI chỉ còn làm DRIVER màn (init + đẩy pixel); vẽ/bố cục/chạm do LVGL lo.
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.11
    WiFi
    Preferences

build_flags =
    ; espnow-message.h (4 góc phòng + node ngoài trời) + unoq-link-protocol.h
    -I../shared
    ; lv_conf.h và các header cạnh mã nguồn
    -I src

    ; Chọn nhánh sơ đồ chân trong src/board-pins.h.
    ; THIẾU CỜ NÀY là biên dịch ra chân của bo QR Box — build vẫn qua, nạp vẫn
    ; xong, và bo chạy với màn câm + cảm ứng chết. Không có lỗi nào để đọc.
    -D BOARD_S3_PANEL=1

    ; --- LVGL ---
    ; lv_conf.h đặt ở src/ chứ không sửa file trong thư viện:
    ; .pio/ bị xoá mỗi lần `pio pkg update`, sửa ở đó là mất lặng lẽ.
    -D LV_CONF_INCLUDE_SIMPLE=1
    ; Các file font sinh bởi lv_font_conv kiểm cờ này để chọn `#include "lvgl.h"`
    ; thay vì "lvgl/lvgl.h" — thiếu là đứt build ở ui/fonts/*.c.
    -D LV_LVGL_H_INCLUDE_SIMPLE=1

    ; --- UART tới Arduino UNO Q: MƯỢN CHÂN UART0 (IO43/IO44) ---
    ;
    ; ĐIỀU KIỆN SỐNG CÒN: cổng USB-C phải là USB GỐC của S3. Khi đó `Serial`
    ; (console) chạy qua USB, KHÔNG qua UART0 — nên hai chân này rảnh thật. Nếu bo
    ; hoá ra có chip cầu CH34x thì console nằm chính trên IO43/44, và nối UNO Q
    ; vào đó là mất luôn cả console lẫn đường UNO Q. KIỂM TRƯỚC KHI HÀN (xem
    ; README.md §Bring-up bước 1).
    ;
    ; ĐƯỢC GÌ: IO14 và IO21 rảnh ra, để dành cho PZEM giai đoạn sau — PZEM-004T
    ; nói Modbus-RTU qua UART, tức đúng 2 chân. Không có đường này thì tới lúc gắn
    ; PZEM sẽ không còn chân nào và phải tháo bớt thứ khác ra.
    ;
    ; CHIỀU KHÔNG ĐƯỢC ĐẢO — ĐÂY LÀ CHỖ DỄ SAI NHẤT:
    ;   Tài liệu bo ghi "RXD0(IO43) / TXD0(IO44)". NGƯỢC với datasheet của chip:
    ;   ESP32-S3 mặc định IOMUX là IO43 = U0TXD, IO44 = U0RXD. Tin datasheet, vì
    ;   nó mới là thứ quyết định ROM bootloader lái chân nào lúc khởi động.
    ;
    ;   => IO43 phải là TX CỦA BO NÀY. Đặt ngược (IO43 làm RX) thì mỗi lần reset,
    ;      ROM lái IO43 làm ngõ RA trong khi UNO Q cũng đang đẩy ngõ ra vào đó —
    ;      hai ngõ ra đấu nhau trên một dây.
    ;
    ; RÁC LÚC KHỞI ĐỘNG LÀ BÌNH THƯỜNG: ROM và bootloader tầng 2 in log ra IO43
    ; trước khi setup() chạy, nên UNO Q nhận một nhúm byte lạ mỗi lần bo reset.
    ; Khung gói đã lọc sẵn (magic 0xAC + CRC8 + trượt byte dò lại) nên nó bị vứt.
    ; Sau khi Serial1.begin() gắn UART1 vào hai chân này qua ma trận GPIO thì UART0
    ; không còn ra tới chân nữa -> hết rác.
    ;
    ; TRẢ GIÁ: còn dây UNO Q thì KHÔNG nạp được qua UART0. Nạp bằng cổng USB-C.
    -D UNOQ_TX_PIN=43
    -D UNOQ_RX_PIN=44
    ; IO14 và IO21: ĐỂ TRỐNG CÓ CHỦ ĐÍCH, dành cho PZEM. Đừng lấy dùng việc khác.

    ; --- IR ---
    ; IO3 LÀ CHÂN STRAPPING (chọn nguồn tín hiệu JTAG) nhưng vô hại ở đây: nó chỉ
    ; có tác dụng khi eFuse JTAG_SEL_ENABLE đã đốt, mà mặc định thì chưa. Vẫn cố ý
    ; đặt IR THU (không phải phát) lên chân này: mắt thu TSOP giữ chân ở mức CAO
    ; ngay từ lúc cấp nguồn, tức mức lúc reset là XÁC ĐỊNH. Đầu phát thì thả nổi
    ; cho tới khi setup() chạy — một chân strapping thả nổi là thứ không nên có.
    ;
    ; NUÔI MẮT THU BẰNG 3.3V, KHÔNG 5V: ngưỡng tuyệt đối của chân là VDD+0.3
    ; (~3.6V). Ở 3.3V thì module phát nên có transistor riêng; loại chỉ có LED nối
    ; tiếp trở (kiểu KY-005) vẫn chạy nhưng dòng thấp, tầm phát yếu.
    -D IR_TX_PIN=2
    -D IR_RX_PIN=3

    ; --- Màn 2.8" ILI9341V, SPI 4 dây ---
    ; ILI9341 CHỨ KHÔNG PHẢI ST7789 — ngược với bo QR Box (schematic bo đó ghi
    ; "ILI9341SP4" nhưng lắp thật là ST7789V). Khai nhầm thì màn KHÔNG chết hẳn:
    ; hai chip dùng chung nhiều lệnh nên fillScreen vẫn ra đúng màu, chỉ chữ và
    ; hình vẽ là nhiễu/xé — nhìn hệt lỗi nhiễu SPI hoặc tranh chấp đa lõi.
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240                ; kích thước GỐC của panel (dọc); xoay bằng TFT_ROTATION
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    ; -1 LÀ ĐÚNG: chân RESET của màn nối chung với EN của chip (tài liệu bo ghi rõ
    ; "share reset pin with ESP32-S3 main control"). Không có chân riêng để lái,
    ; và màn được reset cùng lúc với chip nên cũng không cần.
    -D TFT_RST=-1
    ; TFT_BL cố ý KHÔNG khai: đèn nền (IO45) do BoardIo lái bằng LEDC để chỉnh
    ; được độ sáng; để thư viện tự bật/tắt thì nó ghi đè PWM.
    -D LOAD_GLCD=1
    -D LOAD_GFXFF=1
    ; SMOOTH_FONT bật phần đọc font VLW — thứ DUY NHẤT trên TFT_eSPI hiện được chữ
    ; tiếng Việt có dấu (font GFX đánh chỉ số một byte, chỉ ASCII).
    -D SMOOTH_FONT=1
    ; 40MHz an toàn ở đây, khác bo QR Box phải hạ xuống 27MHz. Lý do: IO10..13 là
    ; ĐÚNG BỘ CHÂN IOMUX của FSPI trên ESP32-S3, nên tín hiệu đi thẳng chứ không
    ; vòng qua ma trận GPIO. Thấy sọc/xé lúc vẽ nhanh thì hạ xuống 27000000.
    -D SPI_FREQUENCY=40000000

    ; --- CHỌN CỔNG SPI: BẮT BUỘC TRÊN ESP32-S3, KHÔNG PHẢI TUỲ CHỌN ---
    ;
    ; Thiếu cờ này thì bo LẶP KHỞI ĐỘNG VÔ HẠN ngay trong tft.init(), trước khi
    ; vẽ được một pixel nào. Đã dính thật, và dấu vết như sau:
    ;
    ;   Guru Meditation Error: Core 1 panic'ed (StoreProhibited)
    ;   EXCVADDR: 0x00000010
    ;   TFT_eSPI::begin_tft_write() at TFT_eSPI.cpp:81
    ;    (inlined by) TFT_eSPI::writecommand()
    ;   TFT_eSPI::init() at TFT_eSPI.cpp:699
    ;
    ; Nguyên nhân nằm ở Processors/TFT_eSPI_ESP32_S3.c: trên S3, khi KHÔNG khai
    ; USE_HSPI_PORT lẫn USE_FSPI_PORT, thư viện không tự tạo đối tượng bus mà lấy
    ; THAM CHIẾU tới `SPI` toàn cục của Arduino:
    ;
    ;     #else // use FSPI port
    ;       SPIClass& spi = SPI;
    ;
    ; Rồi `spi.begin(...)` trên tham chiếu đó không cấp được bus, nên `_spi` vẫn
    ; NULL và lời gọi `spi.beginTransaction()` đầu tiên ghi vào 0x10 — đúng con số
    ; EXCVADDR ở trên. Khai cờ này thì thư viện tự dựng `SPIClass spi =
    ; SPIClass(FSPI)` của riêng nó và begin() chạy đúng.
    ;
    ; FSPI CHỨ KHÔNG PHẢI HSPI, có lý do: FSPI mới là cổng có IOMUX cho IO10..13
    ; (xem chú thích SPI_FREQUENCY ngay trên). Chọn HSPI thì tín hiệu vòng qua ma
    ; trận GPIO và 40MHz thành mạo hiểm — sẽ phải hạ tốc, tức là trả giá tốc độ
    ; cho một lựa chọn không cần thiết.
    -D USE_FSPI_PORT

    ; --- DMA: TẮT TRÊN BO NÀY ---
    ; Callback kết thúc DMA của TFT_eSPI 2.5.43 hỏng trên ESP32-S3 và làm bo chết
    ; trong ngắt ở lần truyền ĐẦU TIÊN — lý do đầy đủ + dấu vết crash ghi ở khối
    ; TFT_USE_DMA đầu src/ui/ui.cpp. Bo QR Box (ESP32 cổ điển) KHÔNG khai cờ này
    ; nên vẫn chạy DMA bình thường.
    ;
    ; Cái giá: mỗi lượt flush do CPU đẩy (pushColors) thay vì DMA. Chấp nhận được
    ; — nhịp vẽ là 200ms và vùng bẩn thường nhỏ hơn nhiều một màn hình.
    -D TFT_USE_DMA=0

    ; --- ĐẢO MÀU: BO NÀY PHẢI LÀ 1 ---
    ; ĐO TRÊN BO THẬT: để mặc định 0 thì toàn bộ giao diện ra ÂM BẢN (nền tối
    ; thành sáng, xanh nhấn #0055FF thành cam). Bố cục vẫn đúng y bản thiết kế
    ; nên rất dễ tưởng mình chọn sai bảng màu chứ không phải phần cứng lật màu.
    ;
    ; NGƯỢC VỚI BO QR BOX, và đó không phải nhầm lẫn: TFT_eSPI gửi INVON vô điều
    ; kiện cho ST7789 (QR Box) nhưng KHÔNG gửi cho ILI9341V (bo này). Cùng một
    ; trị số cho ra hai kết quả trái ngược, nên nó phải nằm ở đây chứ không phải
    ; sửa mặc định trong src/ui/ui.cpp — sửa ở đó là chữa bo này, hỏng bo kia.
    -D DISPLAY_INVERT=1

    ; --- PHÉP THỬ MÀU: ĐÃ CHỐT, KHÔNG BẬT NỮA ---
    ; Bật lại bằng -D DISPLAY_SELFTEST=1 khi đổi lô màn hoặc nghi ngờ màu: nó hiện
    ; 3 ô có ghi tên trong 3 giây, phải ra XANH DUONG / TRANG / XANH LA.
    ;
    ; ĐÃ KIỂM TRÊN BO THẬT (14/08/2026) với DISPLAY_INVERT=1 -> ba ô ra đúng.
    ; Ô TRẮNG là ô phân biệt hai kiểu hỏng rất dễ lẫn: ra ĐEN nghĩa là sai chiều
    ; đảo màu (lật DISPLAY_INVERT), còn VẪN TRẮNG mà xanh dương ra đỏ/cam thì là
    ; đảo thứ tự R↔B (thêm -D TFT_RGB_ORDER=TFT_RGB) — hai fix khác hẳn nhau.
    ;
    ; Để bật thường trực thì không được: đây là panel treo tường, và 3 giây màn
    ; kiểm tra kỹ thuật mỗi lần bật nguồn nhìn như màn hình lỗi chứ không phải màn
    ; khởi động.

    ; --- `Serial` ĐI RA ĐÂU ---
    ; ĐANG ĐẶT LÀ USB GỐC của S3 (cổng USB-C trên bo). Căn cứ: tài liệu bo liệt kê
    ; UART0 (IO43/IO44) như một giao tiếp RIÊNG mang ra chân — tức cổng USB-C
    ; không đi qua chip cầu nào. ĐÂY CŨNG LÀ ĐIỀU KIỆN để mượn IO43/44 cho UNO Q.
    ;
    ; NẾU ĐOÁN SAI (bo thật có chip cầu CH34x): màn hình serial im như bo chết
    ; trong khi nạp vẫn báo thành công. Node ESP32-C3 của dự án đã dính đúng bẫy
    ; này theo chiều ngược lại. Cách phân biệt chắc chắn — xem README.md §Bring-up.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
