; Aircon — ESP32 node NGOÀI TRỜI (outdoor).
;
; VÌ SAO ESP32 CHỨ KHÔNG CÒN ESP8266:
;   node này trước chạy trên NodeMCU ESP8266. Đổi sang ESP32 để CẢ HAI node dùng
;   chung một dòng chip: cùng bộ API ESP-NOW (esp_now.h của IDF, không phải
;   espnow.h kiểu SDK cũ), cùng toolchain, cùng cách nạp. Trước đây mỗi bên một
;   API nên sửa giao thức ESP-NOW là phải sửa hai lần theo hai kiểu khác nhau —
;   đúng loại việc dễ quên một nửa.
;
; HAI cách chạy, chọn bằng env:
;   pio run -e esp32-espnow -t upload   ; MẶC ĐỊNH: vai trò SLAVE, gửi ESP-NOW
;                                       ; về node trong nhà. Không dùng WiFi.
;   pio run -e esp32-wifi   -t upload   ; DỰ PHÒNG: tự nối WiFi + MQTT thẳng lên
;                                       ; cloud. Dùng khi ESP-NOW trục trặc.
;
; Board mặc định = ESP32 DevKit V1 (ESP32-WROOM-32, 30 chân).
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -I../shared          ; espnow-message.h dùng chung với node trong nhà
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8

; Mỗi env chỉ biên dịch ĐÚNG MỘT file main — hai file đều định nghĩa setup()/loop()
; nên biên dịch cả hai sẽ lỗi trùng ký hiệu.
[env:esp32-espnow]
build_src_filter = +<*> -<main-wifi-direct.cpp>

[env:esp32-wifi]
build_src_filter = +<*> -<main-espnow-slave.cpp>
