; ============================================================================
;  BreezeLink — node NGOÀI TRỜI  ·  ESP32-C3-DevKitM-1
; ----------------------------------------------------------------------------
;   pio run -e esp32-espnow -t upload --upload-port COMx
;   pio device monitor -p COMx -b 115200
;
;  Vai trò: SLAVE ESP-NOW. Đọc DHT22 rồi bắn quảng bá về gateway trong nhà;
;  gateway đứng tên publish hộ lên MQTT. Node này KHÔNG nối WiFi, KHÔNG nối MQTT,
;  nên nó cũng không giữ token MQTT nào.
; ----------------------------------------------------------------------------
;  ĐỔI TỪ ESP32 DevKit V1 SANG ESP32-C3 (15/08/2026) — CHỈ ĐỔI BO, GIỮ NGUYÊN
;  CHỨC NĂNG. Cùng dòng chip với 4 node góc phòng, nên từ nay cả năm node cảm
;  biến dùng chung một bo, một toolchain, một bộ bài học. Ba thứ PHẢI đổi theo,
;  và bỏ sót thứ nào cũng hỏng theo kiểu im lặng — xem từng khối bên dưới:
;      1. công suất phát   (hỏng: gói bay vào khoảng không, node vẫn báo "da phat")
;      2. thư viện DHT     (hỏng: panic cả lõi khi chưa cắm cảm biến)
;      3. hai cờ USB       (hỏng: serial im như bo chết dù nạp báo thành công)
; ============================================================================

[env:esp32-espnow]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    ; DHT22. BẢN "for ESPx" CHỨ KHÔNG PHẢI `adafruit/DHT sensor library` — cùng
    ; lý do đã ghi ở ../esp32-room/platformio.ini: bản Adafruit tắt ngắt hơn một
    ; giây khi chưa cắm cảm biến (expectPulse() không thoát sớm). Trên ESP32 hai
    ; lõi việc đó đã đủ gây panic; trên C3 MỘT LÕI thì tệ hơn — ngăn xếp
    ; WiFi/ESP-NOW chạy ngay trên chính lõi đó.
    ;
    ; ĐÂY LÀ THAY ĐỔI BẮT BUỘC KHI ĐỔI BO, không phải dọn dẹp tuỳ thích: bo cũ
    ; (ESP32 hai lõi) chịu được bản Adafruit, bo này thì không.
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19.0
    ; WiFi PHẢI khai tường minh dù không dòng nào trong src/ include nó: bộ dò
    ; phụ thuộc của PlatformIO chỉ quét include trong src/ và trong các thư mục
    ; thư viện, mà `<WiFi.h>` nằm trong ../shared/espnow-slave-radio.h — không
    ; thuộc cả hai. Thiếu dòng này là đứt build ngay ở "WiFi.h: No such file or
    ; directory", mà dòng lỗi lại trỏ vào file shared nên rất dễ đi tìm nhầm
    ; sang phía header.
    WiFi

build_flags =
    ; espnow-message.h + espnow-slave-radio.h dùng chung với gateway và 4 node góc
    -I../shared

    ; --- ĐƯA `Serial` RA CỔNG USB ---
    ; Thiếu hai cờ này thì Serial đi ra UART0 (GPIO20/21) — trên bo nối bằng
    ; USB-Serial/JTAG gốc (esptool in `USB mode: USB-Serial/JTAG`, VID 303A) thì
    ; UART0 KHÔNG nối vào cổng USB nào cả, nên log chạy vào chỗ không ai đọc được.
    ; Triệu chứng rất dễ chẩn đoán nhầm: nạp báo thành công, hash verify xong, mà
    ; mở serial monitor thì im như bo chết.
    ;
    ; Board `esp32-c3-devkitm-1` của PlatformIO không bật sẵn vì bản DevKitM-1
    ; chính hãng có chip CP2102N gắn vào UART0; bo dùng ở đây thì không.
    ;
    ; Vô hại khi chạy ngoài hiện trường: không cắm USB thì Serial.print() rơi vào
    ; hư vô chứ không chặn vòng lặp.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ============================================================================
;  CÔNG SUẤT PHÁT — ĐÃ BỎ `-D SLAVE_TX_POWER=78`, VÀ ĐÂY LÀ HỆ QUẢ LỚN NHẤT
;  CỦA VIỆC ĐỔI BO
; ----------------------------------------------------------------------------
;  Bo cũ (ESP32 DevKit V1) chạy 19,5 dBm được, và lý do rất cụ thể: nó có
;  AMS1117 với tụ lọc đàng hoàng nên gánh nổi đỉnh dòng ~350mA lúc phát. Node
;  ngoài trời lại là node XA NHẤT — qua ít nhất một bức tường — nên ép nó xuống
;  8 dBm khi đó là tự bóp tầm phát vì vấn đề của bo khác.
;
;  BO NÀY THÌ NGƯỢC LẠI. ESP32-C3-DevKitM-1 nuôi qua USB chính là bo mà mặc định
;  8 dBm trong ../shared/espnow-slave-radio.h sinh ra để bảo vệ: ở mức tối đa,
;  điện áp sụt lúc đỉnh dòng làm sóng phát ra bị méo, và gateway nhận 0 gói —
;  y hệt như khi hỏng dây.
;
;  Giữ lại cờ 78 sau khi đổi bo là kiểu hỏng tệ nhất có thể: broadcast KHÔNG CÓ
;  ACK nên node vẫn in "da phat" đều đặn, trong khi không ai nghe được gì. Không
;  một dòng log nào ở bất kỳ đâu báo lỗi.
;
;  MUỐN NÂNG LẠI thì phải cấp nguồn tử tế cho node (adapter riêng + tụ lọc), rồi
;  nâng dần và KIỂM BẰNG LOG GATEWAY — xem dòng `Ngoai troi` có `MAT KET NOI`
;  không, và bộ đếm `[relay]` có tăng đều không. Đừng tin node tự báo.
; ============================================================================
