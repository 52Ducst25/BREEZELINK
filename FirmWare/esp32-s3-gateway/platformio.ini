; BreezeLink — GATEWAY chạy trên ESP32-S3-DevKitC-1 (N16R8), KHÔNG MÀN HÌNH.
;
; VÌ SAO CÓ THƯ MỤC NÀY: bo QR Box Advance (../esp32-qrbox/) hỏng mạch nạp —
; esptool dò được chip nhưng mọi lần ghi khối dữ liệu đều đứt giữa chừng, cả hai
; chiều, không phụ thuộc baud. Cả luồng dữ liệu của hệ đi xuyên qua gateway, nên
; một gateway không nạp được là chặn đứng việc kiểm thử 4 node góc phòng, node
; ngoài trời, và cả đường BLE sang Arduino UNO Q.
;
;   pio run -e esp32s3-gateway -t upload --upload-port COMx
;
; ============================================================================
;  ĐIỀU QUAN TRỌNG NHẤT: THƯ MỤC NÀY KHÔNG CÓ MỘT DÒNG LOGIC GATEWAY NÀO
; ----------------------------------------------------------------------------
;  Nó biên dịch THẲNG mã nguồn của ../esp32-s3-panel/src/, chỉ bỏ thư mục ui/ và
;  thay bằng src/ui-headless.cpp — 5 hàm in ra serial thay vì vẽ lên màn.
;
;  Vì sao không chép mã sang đây cho gọn: chép là tạo ra HAI gateway. Logic thi
;  hành lệnh, chống trùng req_id, xin lại mã IR, ranh giới đề xuất/lệnh của UNO Q
;  — toàn những chỗ tinh vi mà mỗi cái đều đã trả giá một lần để viết cho đúng.
;  Hai bản sao sẽ lệch nhau ngay lần sửa thứ nhất, và triệu chứng là bo trên bàn
;  chạy đúng còn bo treo tường thì không, hoặc ngược lại — không có cách nào biết
;  bên nào mới là bản thật.
;
;  Nhờ vậy bo S3 là NGƯỜI ĐÓNG THẾ THẬT chứ không phải bản mô phỏng: nó chạy
;  chính xác đường mã mà QR Box sẽ chạy. Sửa xong mạch nạp thì nạp lại bo kia,
;  không phải chuyển đổi gì.
;
;  ĐỔI LẠI, PHẢI NHỚ: sửa ../esp32-s3-panel/src/*.cpp là ẢNH HƯỞNG CẢ HAI env.
;  Thêm một hàm Ui:: mới thì build ở đây đứt ở khâu link ("undefined reference to
;  Ui::..."), và cách sửa là thêm bản rỗng vào src/ui-headless.cpp.
; ============================================================================
;  CẤU HÌNH DÙNG CHUNG LUÔN, KHÔNG CÓ config.h RIÊNG
; ----------------------------------------------------------------------------
;  ../esp32-s3-panel/src/config.h là file duy nhất. Cố ý: bo này ĐÓNG THẾ node
;  indoor nên phải dùng ĐÚNG DEVICE_UUID và ĐÚNG token MQTT của hàng devices đó
;  trên web — hai bo không bao giờ chạy cùng lúc. Tạo bản sao ở đây là có hai
;  file cùng chứa một mật khẩu MQTT, và chắc chắn sẽ lệch.
;
;  Trình biên dịch tự tìm ra: `#include "config.h"` trong main.cpp được giải
;  theo thư mục của CHÍNH file đó trước tiên, tức ../esp32-s3-panel/src/.
;  => THƯ MỤC src/ Ở ĐÂY TUYỆT ĐỐI KHÔNG ĐƯỢC CÓ config.h, nếu không thì hai file
;     cùng tên và không nhìn được bằng mắt là bản nào đang có hiệu lực.
;
;  CHÂN KHÔNG CÒN NẰM TRONG config.h. Chúng đã chuyển sang
;  ../esp32-s3-panel/src/board-pins.h, chọn nhánh bằng cờ -D BOARD_*. Env này không
;  khai cờ nào nên nhận nhánh mặc định (chân bo QR Box) — vô hại ở đây vì ui/
;  không được biên dịch, đúng như trước.
; ============================================================================
;  ĐÂY LÀ BO GỠ LỖI, KHÔNG PHẢI PANEL CHÍNH THỨC
; ----------------------------------------------------------------------------
;  Panel treo tường chính thức nay là bo 2.8" ESP32-S3 -> ../esp32-s3-panel/.
;
;  Giữ thư mục này lại vì nó làm được một việc mà panel có màn không làm được:
;  in TOÀN BỘ trạng thái ra serial (GATEWAY_TRACE=1, một dòng mỗi gói vào/ra).
;  Khi luồng dữ liệu có vấn đề mà không rõ lỗi nằm ở node, ở gateway hay ở UNO Q,
;  cắm bo này vào là thấy ngay — không phải suy từ vài con số trên màn 2.8".
; ============================================================================
[env:esp32s3-gateway]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Biên dịch mã của node indoor, trừ phần màn hình -------------------------
; Đường dẫn tính từ src_dir (= src/ của chính env này).
build_src_filter =
    +<*>
    +<../../esp32-s3-panel/src/>
    -<../../esp32-s3-panel/src/ui/>

; --- N16R8 = 16 MB flash + 8 MB PSRAM OCTAL ---------------------------------
; PHẢI KHAI CẢ HAI KHOÁ FLASH. `board_build.flash_size` chỉ vào cấu hình build,
; còn ESPTOOL ĐỌC `board_upload.flash_size` để ghi header ảnh. Khai lệch nhau thì
; bootloader thấy phân vùng nằm ngoài vùng flash nó biết và bỏ cuộc TRONG IM
; LẶNG — lặp rst vô hạn, không in nổi một dòng log, rất dễ chẩn đoán nhầm thành
; chết phần cứng. (Đúng cái bẫy đã mất nhiều giờ ở ../esp32-qrbox/platformio.ini,
; chỉ khác con số.)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; R8 = PSRAM giao tiếp OCTAL (OPI), không phải QSPI. Khai sai thì PSRAM không
; khởi tạo được và Arduino in cảnh báo lúc boot.
; Firmware này KHÔNG dùng PSRAM (không có framebuffer nào) — khai đúng ở đây chỉ
; để bo không kêu, và để nhớ rằng GPIO33..37 đã bị PSRAM chiếm.
board_build.arduino.memory_type = qio_opi

; DÙNG CHUNG BẢNG PHÂN VÙNG VỚI QR BOX. Lý do đầy đủ nằm trong chính file CSV đó;
; tóm tắt: NVS mặc định 20 KB chỉ chứa nổi ~13 khung điều hoà, mà kho mã IR cần
; 18 tổ hợp. Giữ y hệt bảng của bo kia thì hành vi lưu mã giống hệt nhau — nếu
; không thì "hết chỗ NVS" sẽ chỉ xảy ra trên một trong hai bo, và bo còn lại làm
; chứng sai rằng mọi thứ vẫn ổn.
board_build.partitions = ../esp32-s3-panel/partitions-BreezeLink.csv
; PHẢI ĐI KÈM DÒNG TRÊN: PlatformIO không đọc bảng phân vùng để biết ghi app vào
; đâu, nó lấy từ đúng khoá này. Bảng đó đẩy `factory` xuống 0x20000.
board_upload.offset_address = 0x20000

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    ; NimBLE ĐÃ BỎ — đường tới UNO Q nay là UART (../esp32-s3-panel/src/unoq-link.cpp).
    ; Lý do đầy đủ ở ../shared/unoq-link-protocol.h.
    ; BỐN THƯ VIỆN KHUNG DƯỚI ĐÂY PHẢI KHAI TƯỜNG MINH, dù mã có #include chúng.
    ; Bộ dò phụ thuộc của PlatformIO chỉ quét src_dir và các thư mục thư viện —
    ; mà toàn bộ mã thật của env này nằm NGOÀI src_dir (xem build_src_filter).
    ; Thiếu là đứt build ở "WiFi.h: No such file or directory", và dòng lỗi trỏ
    ; vào file của thư mục khác nên rất dễ đi tìm nhầm chỗ.
    WiFi
    Preferences
    ; TFT_eSPI và lvgl CỐ Ý KHÔNG CÓ Ở ĐÂY: ui/ không được biên dịch. Đó cũng là
    ; lý do bo này nhẹ hơn hẳn và không cần khai một rừng cờ TFT_*.

build_flags =
    ; espnow-message.h + unoq-link-protocol.h (dùng chung với mọi node)
    -I../shared
    ; ui-headless.cpp cần thấy "ui/ui.h" của bo indoor. Các file .cpp của bo đó
    ; tự tìm được header cạnh nó, nên dòng này là cho src/ của env này.
    -I../esp32-s3-panel/src

    ; --- UART tới Arduino UNO Q ---
    ; GPIO17/18 sạch: không strapping, không USB gốc (19/20), không flash SPI
    ; (26..32), không PSRAM octal của bản R8 (33..37), không UART0 (43/44), không
    ; LED RGB (38). Nối 3.3V thẳng — bo này không có bộ dịch mức nào.
    ;
    ; KHỚP VỚI CÁCH ĐÃ ĐẤU DÂY THẬT:
    ;     GPIO18 -> chân RX của UNO Q     => GPIO18 phải là TX của bo này
    ;     GPIO17 <- chân TX của UNO Q     => GPIO17 phải là RX của bo này
    ;
    ; ĐẤU CHÉO LÀ BẮT BUỘC: bên phát của một bo phải vào bên thu của bo kia. Nối
    ; TX-TX thì hai bên cùng đẩy mức lên một dây — im lặng hoàn toàn, KHÔNG hỏng
    ; gì cả, nên rất dễ mất thời gian đi tìm ở phía phần mềm.
    ;
    ; GND PHẢI CHUNG. Thiếu thì không có mốc điện áp và byte ra rác ngẫu nhiên,
    ; triệu chứng giống hệt sai baud.
    ;
    ; CẢ HAI BO ĐỀU 3.3V nên nối thẳng được, không cần dịch mức.
    -D UNOQ_TX_PIN=18
    -D UNOQ_RX_PIN=17

    ; --- Nhật ký từng gói vào/ra (src/serial-trace.h) ---
    ; BẬT Ở BO NÀY, TẮT Ở BO QR BOX. Bo này tồn tại để truy lỗi luồng dữ liệu, và
    ; nó không có màn hình — serial là thứ duy nhất nói cho ta biết chuyện gì đang
    ; xảy ra. Bo treo tường thì ngược lại: có màn để nhìn, mà một dòng log cho mỗi
    ; gói (5 node × 5 giây) sẽ nhấn chìm những dòng thật sự đáng đọc.
    -D GATEWAY_TRACE=1

    ; --- Chân IR trên S3 ---
    ; Tránh: GPIO0/3/45/46 (strapping) · GPIO19/20 (USB D-/D+) · GPIO26..32
    ; (flash SPI) · GPIO33..37 (PSRAM octal của bản R8) · GPIO38 (LED RGB trên
    ; DevKitC-1) · GPIO43/44 (UART0).
    ; GPIO4 và GPIO5 sạch, ra header, không mang vai trò strapping nào.
    ;
    ; Chưa hàn LED hồng ngoại thì vẫn chạy được hết luồng dữ liệu — chỉ là máy
    ; lạnh không nhúc nhích. Log vẫn ghi "da phat" vì node thật sự có bắn xung ra
    ; chân; nó không biết đầu kia có LED hay không.
    -D IR_TX_PIN=4
    -D IR_RX_PIN=5

    ; --- `Serial` ĐI RA UART0 (GPIO43/44), KHÔNG ra USB gốc ---
    ; Bo đang dùng nối máy tính qua chip cầu CH343, tức cổng UART — đã kiểm bằng
    ; esptool: nó KHÔNG in dòng `USB mode: USB-Serial/JTAG` như bo C3 (bo đó nối
    ; bằng USB gốc). Nên để mặc định của Arduino là đúng, không thêm cờ gì.
    ;
    ; NẾU ĐỔI SANG CỔNG "USB" (OTG gốc của S3, liệt kê với VID 303A) thì phải mở
    ; hai dòng dưới, nếu không thì log chạy ra UART0 không nối đi đâu cả và màn
    ; hình serial im như bo chết trong khi nạp vẫn báo thành công. Node ESP32-C3
    ; của dự án đã dính đúng bẫy này theo chiều ngược lại.
    ;   -D ARDUINO_USB_MODE=1
    ;   -D ARDUINO_USB_CDC_ON_BOOT=1
