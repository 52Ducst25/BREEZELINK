{% extends "base.html" %}
{% block title %}Đăng nhập — BreezeLink{% endblock %}
{% block content %}
<div class="ac-login-wrap">
  <form class="card ac-login" method="post" action="/web/login">
    <div class="ac-login__brand">BREEZE<span class="ac-accent">LINK</span></div>
    <p class="ac-login__tagline">Điều khiển điều hoà thích ứng</p>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="input" id="email" type="email" name="email" autocomplete="username" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Mật khẩu</label>
      <input class="input" id="password" type="password" name="password" autocomplete="current-password" required>
    </div>

    {% if error %}
    <div class="status-banner status-banner-error" role="alert">{{ error }}</div>
    {% endif %}

    <button class="btn btn-primary" type="submit">Đăng nhập</button>
  </form>
</div>
{% endblock %}
