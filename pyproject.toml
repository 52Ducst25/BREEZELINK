[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aircon"
version = "0.1.0"
description = "AirConditioner — edge-AI adaptive air-conditioning control (multi-tenant FastAPI modular monolith + MQTT worker + SSR admin)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "aiomqtt>=2.0,<3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.4",
    "aiosqlite>=0.20",
    "fakeredis>=2.20",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: requires a live broker/Postgres/Redis stack (AIRCON_E2E=1)",
]

[tool.setuptools.package-data]
# Templates + static ship inside the wheel so the container serves them without a
# bind mount; alembic ships so `alembic upgrade head` works from the image alone.
app = [
    "alembic/*.ini",
    "alembic/**/*.py",
    "alembic/**/*.mako",
    "web/templates/**/*.html",
    "web/static/**/*",
]
